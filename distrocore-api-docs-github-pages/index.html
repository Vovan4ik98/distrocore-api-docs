<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Документация Distrocore API: релизы, треки, файлы, UPC/ISRC, питчинг и аналитика." />
    <title>Distrocore API — документация</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <noscript>Для просмотра интерактивной документации включите JavaScript. <a href="./openapi.json">Скачать OpenAPI</a>.</noscript>
    <div id="app"></div>
    <script src="./scalar.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        persistAuth: false,
        telemetry: false,
        withDefaultFonts: false,
        showDeveloperTools: false,
        agent: { disabled: true },
      });
    </script>
  </body>
</html>
